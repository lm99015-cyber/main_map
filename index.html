<!DOCTYPE html>
<!-- 원소 탐험대 메인 화면입니다.
     지도 그림 위에 클릭 구역 4개를 올려 두고, 누르면 각 학습 페이지로 이동하도록 만들었습니다.
     아래 <style>은 디자인을, <body>는 화면에 놓이는 요소를, <script>는 클릭·마우스 동작을 담당합니다. -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>원소 탐험대</title>

<!-- 한국어 글씨체 불러오기 기능. 구글에서 제공하는 무료 폰트(Noto Sans KR)를 인터넷에서 받아 사용합니다. -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@700;800;900&display=swap" rel="stylesheet">

<style>
/* 브라우저 기본 여백 초기화 기능. 별표(*)는 모든 요소를 가리키며, 브라우저마다 제각각인 기본 여백을 0으로 맞춰 줍니다. */
*{box-sizing:border-box;margin:0;padding:0}

/* 지도 이미지 전체 화면 표시 기능. 화면을 가득 채우고 넘치는 부분은 숨기며, 그림이 없는 빈 공간은 검은색으로 둡니다. */
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Noto Sans KR',sans-serif;}

/* 클릭 구역 위치 기준 틀 기능. position:relative는 안쪽에 있는 요소들의 위치 기준점이 됩니다. */
.wrap{position:relative;width:100%;height:100%;}

/* 지도 이미지 비율 유지 표시 기능. object-fit:contain은 그림을 찌그러뜨리지 않고 화면 안에 통째로 담아 줍니다. */
img{display:block;width:100%;height:100%;object-fit:contain;}

/* 클릭 구역 공통 스타일 기능. 지도 위에 올라가는 투명 버튼 네 칸에 공통으로 적용되는 모양입니다. */
.zone-area{
  position:absolute;
  cursor:pointer;
  text-decoration:none;
  border-radius:16px;
}

/* 마우스 오버 시 빛 효과 표시 기능. :hover는 마우스를 올린 상태를 뜻합니다. */
.zone-area:hover .zone-glow{opacity:1;}

/* 구역별 빛 효과 레이어 기능. 평소에는 투명(opacity:0)하다가 마우스를 올리면 켜집니다. */
.zone-glow{
  position:absolute;inset:0;border-radius:16px;
  opacity:0;transition:opacity 0.2s;pointer-events:none;
}

/* 구역별 빛 색상 적용 기능. (1:초록 / 2:주황 / 3:파랑 / 4:노랑)
   radial-gradient는 가운데에서 바깥으로 번지는 원형 빛이고, rgba 숫자는 차례대로 빨강·초록·파랑·투명도 값입니다. */
.zone-1 .zone-glow{background:radial-gradient(ellipse at center,rgba(60,200,120,0.75) 0%,transparent 60%);}
.zone-2 .zone-glow{background:radial-gradient(ellipse at center,rgba(255,100,60,0.75) 0%,transparent 60%);}
.zone-3 .zone-glow{background:radial-gradient(ellipse at center,rgba(60,150,255,0.75) 0%,transparent 60%);}
.zone-4 .zone-glow{background:radial-gradient(ellipse at center,rgba(245,200,66,0.75) 0%,transparent 60%);}

/* 마우스 오버 시 설명 카드 표시 기능. 구역에 마우스를 올리면 설명 말풍선이 나타납니다. */
.zone-area:hover .zone-label{opacity:1;}

/* 커서 추적 설명 카드 디자인 기능. 마우스를 따라다니는 검은 말풍선의 모양입니다. backdrop-filter는 카드 뒤의 배경을 흐리게 만들어 줍니다. */
.zone-label{
  position:fixed;
  white-space:nowrap;
  background:rgba(5,10,5,0.96);
  border:2.5px solid #f5c842;
  border-radius:14px;
  padding:12px 22px;
  font-size:15px;font-weight:800;
  color:#fff;
  opacity:0;
  transition:opacity 0.25s;
  pointer-events:none;
  backdrop-filter:blur(12px);
  box-shadow:0 6px 32px rgba(0,0,0,0.7),0 0 20px rgba(245,200,66,0.4);
  z-index:9999;
}

/* 설명 카드 내부 이모지·제목·설명 글씨 스타일 기능. 말풍선 안의 아이콘·제목·설명글 각각의 크기와 색을 정합니다. */
.lbl-icon{font-size:24px;margin-right:8px;vertical-align:middle;}
.lbl-name{display:block;font-size:18px;font-weight:900;color:#f5c842;margin-bottom:4px;}
.lbl-desc{display:block;font-size:13px;color:rgba(245,234,208,0.85);font-weight:700;}

/* 클릭 시 색종이 터짐 효과 기능. 작은 점들이 사방으로 퍼지는 폭죽 모양입니다. @keyframes는 0%에서 100%까지 어떻게 변할지 적어 둔 애니메이션 대본입니다. */
.particle{position:fixed;pointer-events:none;z-index:9999;border-radius:50%;animation:burst 0.8s ease-out forwards;}
@keyframes burst{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--tx),var(--ty)) scale(0);opacity:0}}

/* 우측 상단 자료실 버튼(이미지) 디자인 기능. 선생님이 직접 만든 버튼 그림(down.png)을 그대로 버튼으로 사용합니다.
   실제 위치(left·top)와 크기(width)는 아래 <script>에서 지도 이미지의 오른쪽 위 모서리에 맞춰 자동 계산합니다. top·right 값은 스크립트 실행 전까지 쓰이는 임시 위치입니다. */
.drive-btn{
  position:fixed;
  top:20px;right:20px;
  z-index:9999;
  display:block;
  cursor:pointer;
  filter:drop-shadow(0 6px 16px rgba(0,0,0,0.55));
  transition:transform 0.2s,filter 0.2s;
}

/* 자료실 버튼 그림 표시 기능. 버튼 칸을 가로로 가득 채우되 세로는 비율대로 자동 조절하여 그림이 찌그러지지 않게 합니다.
   (위쪽의 공통 img 규칙보다 이 규칙이 우선 적용됩니다.) */
.drive-btn img{display:block;width:100%;height:auto;}

/* 자료실 버튼 마우스 오버 효과 기능. 마우스를 올리면 버튼이 살짝 떠오르고 커지며 그림자가 진해집니다. */
.drive-btn:hover{
  transform:translateY(-2px) scale(1.04);
  filter:drop-shadow(0 9px 22px rgba(0,0,0,0.7));
}
</style>
</head>
<body>

<!-- 우측 상단 자료실 버튼 표시 기능. 누르면 새 탭(target="_blank")으로 원소 탐험대 구글 드라이브 자료실이 열립니다.
     버튼 모양은 선생님이 만든 그림(down.png)을 사용하며, rel="noopener noreferrer"는 새 탭으로 열 때의 보안 설정입니다. -->
<a class="drive-btn" href="https://drive.google.com/drive/folders/1ZRHTjk06uyy15AovOd5ozJICbskLoTYE" target="_blank" rel="noopener noreferrer">
  <img src="https://lm99015-cyber.github.io/main_map/down.png" alt="자료실" draggable="false">
</a>

<!-- 전체 화면 레이아웃 틀 기능. -->
<div class="wrap" id="wrap">

  <!-- 배경 지도 이미지 표시 기능. src는 화면에 띄울 그림의 인터넷 주소이고, draggable="false"는 그림이 마우스로 끌려가지 않도록 막아 줍니다. -->
  <img src="https://lm99015-cyber.github.io/main_map/main_image.png" id="mapImg" alt="원소 탐험 지도" draggable="false">

  <!-- 1번 구역: 주기율표 탐색 페이지 이동 기능. <a href>는 누르면 이동할 페이지 주소이고, onclick은 누르는 순간 색종이 효과를 실행합니다. -->
  <a class="zone-area zone-1" id="zone1" href="https://lm99015-cyber.github.io/periodic_table1/" onclick="spawnConfetti(event)">
    <div class="zone-glow"></div>
    <div class="zone-label"><span class="lbl-icon">🗺️</span><span class="lbl-name">원소 탐험</span><span class="lbl-desc">주기율표를 탐험하고<br>원소의 특징을 알아봐요!</span></div>
  </a>

  <!-- 2번 구역: 화학식·몰량 계산 페이지 이동 기능. -->
  <a class="zone-area zone-2" id="zone2" href="https://lm99015-cyber.github.io/Molar_Mass/" onclick="spawnConfetti(event)">
    <div class="zone-glow"></div>
    <div class="zone-label"><span class="lbl-icon">🧪</span><span class="lbl-name">화학식 탐험</span><span class="lbl-desc">화학식 조합부터 몰량 계산까지!</span></div>
  </a>

  <!-- 3번 구역: AI 학습 도우미 페이지 이동 기능. (구글 로그인 필요) -->
  <a class="zone-area zone-3" id="zone3" href="https://notebooklm.google.com/notebook/e7696589-846f-4c44-8b16-74a3f20c8126/preview" onclick="spawnConfetti(event)">
    <div class="zone-glow"></div>
    <div class="zone-label"><span class="lbl-icon">🤖</span><span class="lbl-name">AI 원소 연구소</span><span class="lbl-desc">AI와 함께 궁금한 것을 연구해요!<br>🔑 구글 계정 로그인 필요</span></div>
  </a>

  <!-- 4번 구역: 원소 게임 레벨 선택 페이지 이동 기능. -->
  <a class="zone-area zone-4" id="zone4" href="https://lm99015-cyber.github.io/game_level/" onclick="spawnConfetti(event)">
    <div class="zone-glow"></div>
    <div class="zone-label"><span class="lbl-icon">🎮</span><span class="lbl-name">원소 게임존</span><span class="lbl-desc">게임으로 원소를 정복하라!</span></div>
  </a>
</div>

<script>
/* 구역별 위치 데이터 저장 기능.
   각 구역이 지도 위 어디쯤에 있는지를 % 좌표로 적어 둔 목록입니다. 화면 크기가 달라도 비율로 적어 두면 항상 지도의 같은 자리에 놓입니다.
   x1, y1은 구역의 왼쪽 위 모서리, x2, y2는 오른쪽 아래 모서리의 위치입니다. */
const ZONES = [
  { id:'zone1', x1:3.5,  y1:60.7, x2:24.3, y2:84.0 },
  { id:'zone2', x1:30.5, y1:60.2, x2:49.1, y2:82.9 },
  { id:'zone3', x1:54.7, y1:61.7, x2:70.8, y2:84.1 },
  { id:'zone4', x1:75.7, y1:61.1, x2:95.3, y2:85.5 },
];

/* 화면 크기에 따른 지도 이미지 실제 표시 영역 계산 기능.
   그림은 비율을 지키며 화면에 들어오기 때문에, 화면 비율과 다르면 영화 화면처럼 위아래나 좌우에 검은 여백이 생깁니다.
   이 여백을 뺀, 실제 그림의 시작점(ox, oy)과 크기(rw, rh)를 구해 줍니다. */
function getImageRect() {
  const img = document.getElementById('mapImg');
  const iw = img.naturalWidth  || 1920;   // 그림의 원래 가로 픽셀
  const ih = img.naturalHeight || 1080;   // 그림의 원래 세로 픽셀
  const sw = window.innerWidth;           // 창의 가로 크기
  const sh = window.innerHeight;          // 창의 세로 크기
  const imgRatio    = iw / ih;            // 그림의 가로세로 비율
  const screenRatio = sw / sh;            // 화면의 가로세로 비율
  let rw, rh, ox, oy;
  if (imgRatio > screenRatio) {
    // 그림이 화면보다 가로로 길 경우 — 가로를 채우고 위아래에 여백
    rw = sw; rh = sw / imgRatio;
    ox = 0;  oy = (sh - rh) / 2;
  } else {
    // 그림이 화면보다 세로로 길 경우 — 세로를 채우고 좌우에 여백
    rh = sh; rw = sh * imgRatio;
    ox = (sw - rw) / 2; oy = 0;
  }
  return { ox, oy, rw, rh };
}

/* 구역 클릭 영역 위치·크기 자동 적용 기능.
   % 좌표를 실제 화면의 픽셀 위치와 크기로 바꾸어 각 구역에 적용합니다. */
function positionZones() {
  const { ox, oy, rw, rh } = getImageRect();
  ZONES.forEach(z => {
    const el = document.getElementById(z.id);
    if (!el) return;
    const left   = ox + rw * z.x1 / 100;
    const top    = oy + rh * z.y1 / 100;
    const width  = rw * (z.x2 - z.x1) / 100;
    const height = rh * (z.y2 - z.y1) / 100;
    el.style.left   = left   + 'px';
    el.style.top    = top    + 'px';
    el.style.width  = width  + 'px';
    el.style.height = height + 'px';
  });

  /* 자료실 버튼을 지도 이미지 오른쪽 위 모서리에 맞추는 기능.
     화면이 아니라 실제 그림 영역을 기준으로 위치를 잡아, 좌우·상하 검은 여백이 있어도 항상 지도 안쪽 우측 상단에 놓이도록 합니다.
     버튼 그림 크기(bw)는 그림 너비의 12%로 정하되 90~220px 사이로 제한하고, 여백 m은 그림 너비의 1.5%(최소 16px)로 두어 화면이 커져도 비율이 자연스럽게 유지됩니다. */
  const driveBtn = document.querySelector('.drive-btn');
  if (driveBtn) {
    const m  = Math.max(16, rw * 0.015);
    const bw = Math.min(220, Math.max(90, rw * 0.12));
    driveBtn.style.width = bw + 'px';
    driveBtn.style.right = 'auto';
    driveBtn.style.left  = (ox + rw - bw - m) + 'px';
    driveBtn.style.top   = (oy + m) + 'px';
  }
}

/* 페이지 로드·창 크기 변경 시 구역 위치 자동 재계산 기능.
   그림을 모두 불러왔을 때와 창 크기가 바뀔 때마다 버튼 위치를 다시 맞춰 줍니다. */
const img = document.getElementById('mapImg');
img.addEventListener('load', positionZones);
if (img.complete) positionZones();
window.addEventListener('resize', positionZones);

/* 마우스 오버 시 설명 카드·빛 효과 표시·숨김 기능.
   구역에 마우스가 들어오면 카드와 빛을 켜고, 벗어나면 끕니다. activeLabel은 지금 켜져 있는 카드를 기억해 두는 변수입니다. */
let activeLabel = null;
document.querySelectorAll('.zone-area').forEach(zone => {
  const label = zone.querySelector('.zone-label');
  const glow  = zone.querySelector('.zone-glow');
  zone.addEventListener('mouseenter', () => {
    activeLabel = label;
    if(label) label.style.opacity = '1';
    if(glow)  glow.style.opacity  = '1';
  });
  zone.addEventListener('mouseleave', () => {
    activeLabel = null;
    if(label) label.style.opacity = '0';
    if(glow)  glow.style.opacity  = '0';
  });
});

/* 설명 카드 커서 실시간 추적 및 화면 밖 이탈 방지 기능.
   마우스를 움직일 때마다 설명 카드가 커서 옆을 따라오도록 하되, 화면 밖으로 잘리지 않게 위치를 보정합니다.
   4번(맨 오른쪽) 구역은 카드가 오른쪽으로 넘치기 쉬워서 항상 커서 왼쪽에 띄워 줍니다. */
document.addEventListener('mousemove', e => {
  if (!activeLabel) return;
  const lw = activeLabel.offsetWidth || 220;   // 카드 가로 크기
  const lh = activeLabel.offsetHeight || 80;   // 카드 세로 크기
  const forceLeft = activeLabel.closest('#zone4') !== null;
  let x = forceLeft ? e.clientX - lw - 20 : e.clientX + 20;
  let y = e.clientY - lh / 2;
  if (!forceLeft && x + lw > window.innerWidth  - 10) x = e.clientX - lw - 20;  // 오른쪽이 넘치면 왼쪽으로
  if (y < 10) y = 10;                                                          // 위로 넘치면 아래로
  if (y + lh > window.innerHeight - 10) y = window.innerHeight - lh - 10;      // 아래로 넘치면 위로
  activeLabel.style.left = x + 'px';
  activeLabel.style.top  = y + 'px';
});

/* 뒤로가기 복귀 시 화면 상태 초기화 기능.
   다른 페이지에 갔다가 뒤로가기로 돌아왔을 때, 켜진 채 남아 있을 수 있는 빛과 카드를 모두 꺼 줍니다. */
window.addEventListener('pageshow', () => {
  activeLabel = null;
  document.querySelectorAll('.zone-glow').forEach(g => g.style.opacity = '0');
  document.querySelectorAll('.zone-label').forEach(l => l.style.opacity = '0');
});

/* 구역 클릭 시 색종이 터짐 효과 생성 기능.
   클릭한 자리에서 색점 18개를 만들어 사방으로 흩뿌리고, 각 점은 약 0.9초 뒤에 사라집니다. */
function spawnConfetti(e) {
  const x = e.clientX, y = e.clientY;          // 클릭한 위치
  const cols = ["#f5c842","#22a86a","#3b82f6","#e8421a","#ffffff","#a0d060"];   // 색종이 색 목록
  for (let i = 0; i < 18; i++) {
    const p = document.createElement("div");
    p.className = "particle";
    const sz = 4 + Math.random()*8, ang = (Math.PI*2/18)*i, dist = 60 + Math.random()*80;   // 크기·방향·거리는 무작위
    p.style.cssText = `left:${x}px;top:${y}px;width:${sz}px;height:${sz}px;background:${cols[i%cols.length]};--tx:${Math.cos(ang)*dist}px;--ty:${Math.sin(ang)*dist}px;animation-duration:${0.5+Math.random()*0.4}s;`;
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 900);
  }
}
</script>
</body>
</html>
